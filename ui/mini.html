<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceKeep · ミニモニター</title><link rel="stylesheet" href="mini.css"></head>
<body><main>
  <header><img class="brand" src="tracekeep.png" alt=""><strong>TRACE<span>KEEP</span></strong><span id="preview" hidden>模擬</span><button id="full" aria-label="詳細モニターを開く" title="詳細モニターを開く"><img src="icons/chevron-right.svg" alt=""></button></header>
  <section class="readings" aria-label="最新の温度">
    <div id="cpu-gauge" class="gauge" tabindex="0"><canvas id="cpu-arc" aria-hidden="true"></canvas><p><strong id="cpu">—</strong><span class="unit">°C</span></p><span class="eyebrow">CPU</span></div>
    <div id="gpu-gauge" class="gauge" tabindex="0"><canvas id="gpu-arc" aria-hidden="true"></canvas><p><strong id="gpu">—</strong><span class="unit">°C</span></p><span class="eyebrow">GPU</span></div>
  </section>
  <section id="workers" class="workers" aria-label="各記録処理の稼働状態"></section>
  <footer><span id="light" class="light"></span><span id="status-title">確認中</span></footer><p id="notice" role="status" aria-live="polite"></p>
</main><script src="mini-model.js"></script><script src="temperature-gauge.js"></script><script src="mini.js"></script></body></html>
