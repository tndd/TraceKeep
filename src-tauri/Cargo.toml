[package]
name = "pc-diagnostics"
version = "0.1.0"
description = "Local PC diagnostics console"
edition = "2021"
rust-version = "1.85"

[lib]
name = "diagnostics_core"
path = "src/lib.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
