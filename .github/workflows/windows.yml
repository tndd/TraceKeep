name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: Visualization data integrity
        run: node --test scripts/Test-Visualizations.cjs
      - name: Collector migration guard
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-CollectorCoordination.ps1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-rust-
      - name: Rust tests
        working-directory: src-tauri
        run: cargo +stable test --release --locked
      - name: Build desktop executable
        working-directory: src-tauri
        run: cargo +stable build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pc-diagnostics-windows
          path: |
            src-tauri/target/release/pc-diagnostics.exe
            src-tauri/Cargo.lock
          if-no-files-found: error
