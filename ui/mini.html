<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceKeep · ミニモニター</title><link rel="stylesheet" href="mini.css"></head>
<body><main>
  <header><span id="light" class="light"></span><span id="status-title">確認中</span><span id="preview" hidden>模擬</span><button id="full" aria-label="詳細モニターを開く" title="詳細モニターを開く">詳細 ↗</button></header>
  <section class="readings" aria-label="最新の温度"><div><span class="eyebrow">CPU</span><p><strong id="cpu">—</strong><span class="unit">°C</span></p></div><div><span class="eyebrow">GPU</span><p><strong id="gpu">—</strong><span class="unit">°C</span></p></div></section>
  <section id="workers" class="workers" aria-label="各記録処理の稼働状態"></section>
  <footer>記録の操作はトレイを右クリック</footer><p id="notice" role="status" aria-live="polite"></p>
</main><script src="mini-model.js"></script><script src="mini.js"></script></body></html>
